<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tongji 数据处理工具</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 700px; margin: 60px auto; padding: 30px; background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p.desc { color: #666; font-size: 14px; margin-bottom: 24px; }
  .upload-box { border: 2px dashed #ccc; border-radius: 8px; padding: 30px; text-align: center; margin-bottom: 16px; cursor: pointer; transition: .2s; }
  .upload-box:hover { border-color: #2196F3; background: #f0f7ff; }
  .upload-box.dragover { border-color: #2196F3; background: #e3f2fd; }
  .upload-box .icon { font-size: 36px; color: #999; margin-bottom: 8px; }
  .upload-box .label { font-size: 14px; color: #666; }
  .file-list { margin: 12px 0; }
  .file-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f9f9f9; border-radius: 4px; margin-bottom: 4px; font-size: 13px; }
  .file-item .del { color: #f44336; cursor: pointer; font-weight: bold; }
  .tpl-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #f0f7ff; border-radius: 6px; margin: 16px 0; }
  .tpl-row .status { color: #2196F3; font-size: 14px; }
  .btn { width: 100%; padding: 12px; background: #2196F3; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: .2s; }
  .btn:hover { background: #1976D2; }
  .btn:disabled { background: #bbb; cursor: not-allowed; }
  .log { margin-top: 16px; padding: 12px; background: #fafafa; border-radius: 6px; font-size: 13px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; display: none; }
  .log-show { display: block; }
</style>
</head>
<body>
<div class="container">
  <h1>📊 Tongji 处理工具</h1>
  <p class="desc">上传所有数据文件和模板文件，自动计算统计结果</p>

  <div class="upload-box" id="dropZone">
    <div class="icon">📁</div>
    <div class="label">点击选择 或 拖拽数据文件(.xlsx)到此处</div>
  </div>
  <input type="file" id="fileInput" multiple accept=".xlsx" style="display:none">

  <div class="file-list" id="fileList"></div>

  <div class="tpl-row" id="tplRow">
    <span>📄 未选择模板文件</span>
  </div>
  <input type="file" id="tplInput" accept=".xlsx" style="display:none">

  <button class="btn" id="processBtn" disabled>开始处理</button>
  <div class="log" id="logArea"></div>
</div>

<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const fileList = document.getElementById("fileList");
const tplInput = document.getElementById("tplInput");
const tplRow = document.getElementById("tplRow");
const processBtn = document.getElementById("processBtn");
const logArea = document.getElementById("logArea");
let dataFiles = [];
let tplFile = null;

dropZone.onclick = () => fileInput.click();
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add("dragover"); };
dropZone.ondragleave = () => dropZone.classList.remove("dragover");
dropZone.ondrop = e => { e.preventDefault(); dropZone.classList.remove("dragover"); handleFiles(e.dataTransfer.files); };
fileInput.onchange = () => handleFiles(fileInput.files);

tplRow.onclick = () => tplInput.click();
tplInput.onchange = () => { tplFile = tplInput.files[0]; updateUI(); };

function handleFiles(files) {
  for (let f of files) {
    if (!f.name.endsWith(".xlsx")) continue;
    if (!dataFiles.find(x => x.name === f.name && x.size === f.size)) dataFiles.push(f);
  }
  updateUI();
}

function removeFile(name, size) {
  dataFiles = dataFiles.filter(x => !(x.name === name && x.size === size));
  updateUI();
}

function updateUI() {
  fileList.innerHTML = dataFiles.map(f => `<div class="file-item"><span class="del" onclick="removeFile('${f.name}',${f.size})">✕</span>📄 ${f.name}</div>`).join("");
  tplRow.innerHTML = tplFile
    ? `<span class="status">●</span> 模板: ${tplFile.name}`
    : `<span>📄 点击选择模板文件 (tongji.xlsx)</span>`;
  processBtn.disabled = dataFiles.length === 0 || !tplFile;
}

processBtn.onclick = async () => {
  processBtn.disabled = true; processBtn.textContent = "处理中...";
  logArea.textContent = ""; logArea.classList.add("log-show");
  const fd = new FormData();
  dataFiles.forEach(f => fd.append("data_files", f));
  fd.append("template_file", tplFile);
  try {
    const res = await fetch("/process", { method: "POST", body: fd });
    if (!res.ok) { logArea.textContent = "服务器错误: " + await res.text(); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "tongji_processed.xlsx"; a.click();
    URL.revokeObjectURL(url);
    logArea.textContent = "✅ 处理完成！文件已下载。";
  } catch (e) {
    logArea.textContent = "❌ 处理失败: " + e.message;
  }
  processBtn.disabled = false; processBtn.textContent = "开始处理";
};
</script>
</body>
</html>
